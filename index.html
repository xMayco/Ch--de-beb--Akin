<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d89c8">
<title>Chá de Bebê do Akin 💙</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:#eaf5fc}
body{font-family:Georgia,"Times New Roman",serif;display:flex;justify-content:center;overflow-x:hidden;-webkit-text-size-adjust:100%}
.invite{position:relative;width:min(100vw,1024px);overflow:hidden;background:#eaf5fc}
.invite-art{display:block;width:100%;height:auto}
.hotspot{position:absolute;z-index:10;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:25px}
.hotspot-map{left:6.5%;top:81.9%;width:28.3%;height:10.9%}
.hotspot-whatsapp{left:36.2%;top:81.9%;width:28%;height:10.9%}
.hotspot-gifts{left:65%;top:81.9%;width:28%;height:10.9%}
.layer{position:absolute;pointer-events:none}
.float-balloon{width:7.5%;aspect-ratio:.72;border-radius:52% 48% 48% 48%;background:radial-gradient(circle at 31% 23%,rgba(255,255,255,.8) 0 7%,rgba(255,255,255,.1) 8% 19%,transparent 20%),linear-gradient(145deg,#a9d9f7,#4b94d0 72%);opacity:.28;animation:float 5s ease-in-out infinite}
.b1{left:5%;top:8%}.b2{right:5%;top:13%;animation-delay:1.3s}.b3{left:13%;top:28%;width:5.5%;animation-delay:.7s}.b4{right:13%;top:30%;width:5.5%;animation-delay:2s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.spark{width:10px;height:10px;background:#e6b640;transform:rotate(45deg);border-radius:2px;opacity:.55;animation:twinkle 2.5s ease-in-out infinite}
.s1{left:25%;top:6%}.s2{right:23%;top:11%;animation-delay:.8s}.s3{left:9%;top:40%;animation-delay:1.3s}.s4{right:8%;top:43%;animation-delay:1.9s}
@keyframes twinkle{0%,100%{transform:rotate(45deg) scale(.7);opacity:.25}50%{transform:rotate(45deg) scale(1.35);opacity:.95}}

#openingToggle,#giftToggle{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opening{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.98),rgba(255,255,255,.88) 35%,rgba(93,160,212,.95));transition:opacity .45s,visibility .45s}
#openingToggle:checked + .opening{opacity:0;visibility:hidden;pointer-events:none}
.opening-card{width:min(92vw,520px);padding:44px 28px 34px;border-radius:42px;border:3px solid rgba(211,169,62,.72);background:rgba(255,255,255,.94);box-shadow:0 25px 70px rgba(29,79,119,.3);text-align:center}
.crown{font-size:70px}.opening-title{margin:18px 0 0;color:#286fae;font-size:clamp(28px,7vw,46px);line-height:1.12}.opening-name{margin:10px 0;color:#4d92cf;font-size:clamp(46px,13vw,76px);font-style:italic}.opening-sub{color:#173f68;font-size:clamp(16px,4vw,21px);line-height:1.5}
.open-button{display:inline-block;border:0;border-radius:32px;padding:15px 34px;background:linear-gradient(#5aa4df,#317fbe);color:#fff;font-size:17px;font-weight:800;cursor:pointer}

.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(18,55,82,.72);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}
#giftToggle:checked ~ .gift-modal{opacity:1;visibility:visible;pointer-events:auto}
.modal-card{position:relative;width:min(94vw,800px);max-height:94vh;max-height:94dvh;overflow:auto;border-radius:22px;background:#fff;box-shadow:0 25px 70px rgba(0,0,0,.35);-webkit-overflow-scrolling:touch}
.modal-card img{display:block;width:100%;height:auto}
.close{position:absolute;z-index:3;right:10px;top:10px;width:43px;height:43px;border:0;border-radius:50%;background:#3d89c8;color:#fff;font-size:28px;line-height:43px;text-align:center;cursor:pointer}
.back{display:block;width:78%;max-width:330px;margin:10px auto 18px;padding:12px 18px;border-radius:26px;background:#3d89c8;color:#fff;text-align:center;text-decoration:none;font-family:Arial,sans-serif;font-weight:800;cursor:pointer}
@media (max-width:600px){
  .modal{padding:8px}
  .modal-card{width:96vw;max-height:92dvh;border-radius:18px}
  .close{right:7px;top:7px}
}
</style>
</head>
<body>

<input type="checkbox" id="openingToggle" checked>
<section class="opening" aria-label="Abertura do convite">
  <div class="opening-card">
    <div class="crown">👑</div>
    <h1 class="opening-title">Parabéns!<br>Você foi convidado<br>para o chá de bebê do</h1>
    <div class="opening-name">Akin</div>
    <p class="opening-sub">💙 Uma celebração muito especial está esperando por você! 💙</p>
    <label class="open-button" for="openingToggle">✨ Abrir convite ✨</label>
  </div>
</section>
